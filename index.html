<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Load the open-source HTML5-QRCode library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    /* Cebroid 2k26 Dark Theme */
    body {
      font-family: 'Georgia', serif;
      background-color: #050505;
      color: #eaeaea;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h2 { color: #e65c00; text-transform: uppercase; letter-spacing: 1px; }
    
    /* Scanner Container */
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      display: none; /* Hidden until button is clicked */
      border: 2px solid #e65c00;
      border-radius: 10px;
      background: #111;
      overflow: hidden;
    }

    /* Buttons */
    .btn {
      background-color: #e65c00;
      color: #fff;
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      font-family: Arial, sans-serif;
      box-shadow: 0 4px 6px rgba(230, 92, 0, 0.3);
    }
    .btn:disabled { background-color: #555; cursor: not-allowed; box-shadow: none; }
    .btn-success { background-color: #28a745; box-shadow: 0 4px 6px rgba(40, 167, 69, 0.3); }
    .btn-secondary {
      background-color: transparent;
      color: #e65c00;
      border: 2px solid #e65c00;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      font-family: Arial, sans-serif;
      transition: background 0.2s, color 0.2s;
    }
    .btn-secondary:hover { background-color: #e65c00; color: #fff; }

    /* Manual Entry Panel */
    #manual-entry-panel {
      display: none;
      background: #131313;
      border: 1px solid #e65c00;
      border-radius: 10px;
      padding: 22px 20px;
      margin: 18px auto;
      max-width: 400px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    #manual-entry-panel p {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #aaa;
      margin: 0 0 14px;
    }
    #manual-ticket-input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 16px;
      background: #1e1e1e;
      border: 1.5px solid #444;
      border-radius: 8px;
      color: #eaeaea;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #manual-ticket-input:focus {
      border-color: #e65c00;
      box-shadow: 0 0 0 3px rgba(230,92,0,0.18);
    }
    #manual-ticket-input::placeholder { color: #555; }
    #manual-verify-btn {
      margin-top: 12px;
      width: 100%;
      padding: 13px;
      background: #e65c00;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, sans-serif;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(230,92,0,0.25);
    }
    #manual-verify-btn:hover:not(:disabled) { background: #ff7a1a; transform: translateY(-1px); }
    #manual-verify-btn:disabled { background: #555; cursor: not-allowed; box-shadow: none; transform: none; }

    /* Results Card */
    #result-card {
      display: none;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 10px;
      margin: 20px auto;
      max-width: 400px;
      border: 1px solid #333;
      text-align: left;
      font-family: Arial, sans-serif;
    }
    .detail { margin: 12px 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .detail span { color: #e65c00; font-weight: bold; float: right; }
    
    #status-msg { margin-top: 15px; color: #888; font-family: Arial, sans-serif; }
  </style>
</head>
<body>

  <h2>Kingsguard Scanner</h2>
  <p style="font-family: Arial, sans-serif; font-size: 14px; color: #aaa;">Verify tributes entering the symposium</p>

  <button id="start-btn" class="btn" onclick="startScanner()">Open Rear Camera</button>

  <!-- Manual Entry Toggle -->
  <div>
    <button class="btn-secondary" onclick="toggleManualEntry()">✏️ Enter Ticket Number Manually</button>
  </div>

  <!-- Manual Entry Panel -->
  <div id="manual-entry-panel">
    <p>QR not available? Type the participant's ticket number below.</p>
    <input
      id="manual-ticket-input"
      type="text"
      placeholder="e.g. CEB2K26-001"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="characters"
      spellcheck="false"
      onkeydown="if(event.key==='Enter') manualVerify()"
    />
    <button id="manual-verify-btn" onclick="manualVerify()">🔍 Verify Ticket</button>
  </div>

  <div id="reader"></div>
  <div id="status-msg"></div>

  <!-- Participant Details Card -->
  <div id="result-card">
    <h3 style="color:#e65c00; text-align:center; margin-top:0; border-bottom: 2px solid #e65c00; padding-bottom:10px;">Tribute Identified</h3>
    <div class="detail"><strong>Name:</strong> <span id="res-name"></span></div>
    <div class="detail"><strong>College:</strong> <span id="res-college"></span></div>
    <div class="detail"><strong>Events:</strong> <span id="res-events"></span></div>
    <div class="detail"><strong>Ticket:</strong> <span id="res-ticket"></span></div>
    
    <div style="text-align: center;">
      <button id="mark-btn" class="btn btn-success" onclick="markAttendance()">Grant Access (Mark Present)</button>
    </div>
  </div>

  <script>
    let html5QrCode;
    let currentRow = null;
    let manualPanelOpen = false;

    function toggleManualEntry() {
      manualPanelOpen = !manualPanelOpen;
      const panel = document.getElementById('manual-entry-panel');
      panel.style.display = manualPanelOpen ? 'block' : 'none';
      if (manualPanelOpen) {
        document.getElementById('manual-ticket-input').focus();
        // Hide scanner if open
        if (html5QrCode) {
          html5QrCode.stop().catch(() => {});
          document.getElementById('reader').style.display = 'none';
          document.getElementById('start-btn').style.display = 'inline-block';
          document.getElementById('status-msg').innerText = '';
        }
      }
    }

    function manualVerify() {
      const input = document.getElementById('manual-ticket-input');
      const ticketNumber = input.value.trim();
      if (!ticketNumber) {
        input.focus();
        input.style.borderColor = '#ff4444';
        input.style.boxShadow = '0 0 0 3px rgba(255,68,68,0.2)';
        setTimeout(() => {
          input.style.borderColor = '';
          input.style.boxShadow = '';
        }, 1500);
        return;
      }

      const btn = document.getElementById('manual-verify-btn');
      btn.disabled = true;
      btn.innerText = 'Consulting the Maesters...';
      document.getElementById('status-msg').innerText = '';
      document.getElementById('result-card').style.display = 'none';

      verifyTicket(ticketNumber, function() {
        btn.disabled = false;
        btn.innerText = '🔍 Verify Ticket';
      });
    }

    function startScanner() {
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('reader').style.display = 'block';
      document.getElementById('status-msg').innerText = "Initializing rear camera...";

      html5QrCode = new Html5Qrcode("reader");
      
      // Configure scanner to prioritize rear camera
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config,
        onScanSuccess,
        onScanFailure
      ).catch((err) => {
        document.getElementById('status-msg').innerText = "Error accessing camera. Please ensure permissions are granted.";
        document.getElementById('start-btn').style.display = 'inline-block';
      });
    }

    function onScanSuccess(decodedText, decodedResult) {
      // Stop scanner upon successful read
      html5QrCode.stop().then(() => {
        document.getElementById('reader').style.display = 'none';
        document.getElementById('status-msg').innerText = "Sigil scanned! Consulting the Maesters...";
        verifyTicket(decodedText);
      }).catch((err) => {
        console.error("Failed to stop scanner", err);
      });
    }

    function onScanFailure(error) {
      // Ignore continuous background scanning errors
    }

    function verifyTicket(ticketNumber, onDone) {
      // Call backend Google Apps Script function
      google.script.run
        .withSuccessHandler(function(response) {
          if (onDone) onDone();
          if (response.status === 'success') {
            document.getElementById('status-msg').innerText = "";
            document.getElementById('result-card').style.display = 'block';
            
            // Close manual panel after successful lookup
            if (manualPanelOpen) {
              document.getElementById('manual-entry-panel').style.display = 'none';
              manualPanelOpen = false;
              document.getElementById('manual-ticket-input').value = '';
            }

            // Populate details
            document.getElementById('res-name').innerText = response.name;
            document.getElementById('res-college').innerText = response.college;
            document.getElementById('res-events').innerText = response.events;
            document.getElementById('res-ticket').innerText = response.ticket;
            
            currentRow = response.row; // Save row number for attendance marking
          } else {
            // Ticket not found
            document.getElementById('status-msg').innerText = response.message;
            // Only show QR button if not in manual mode
            if (!manualPanelOpen) {
              document.getElementById('start-btn').style.display = 'inline-block';
              document.getElementById('start-btn').innerText = "Scan Another Sigil";
            }
          }
        })
        .withFailureHandler(function(error) {
          if (onDone) onDone();
          document.getElementById('status-msg').innerText = "Server error: " + error.message;
        })
        .getParticipantDetails(ticketNumber);
    }

    function markAttendance() {
      if (!currentRow) return;
      
      const btn = document.getElementById('mark-btn');
      btn.disabled = true;
      btn.innerText = "Forging Records...";
      
      google.script.run
        .withSuccessHandler(function(response) {
          alert(response.message);
          
          // Reset UI for the next participant
          document.getElementById('result-card').style.display = 'none';
          currentRow = null;
          // Show appropriate input method
          if (manualPanelOpen) {
            document.getElementById('manual-entry-panel').style.display = 'block';
            document.getElementById('manual-ticket-input').value = '';
            document.getElementById('manual-ticket-input').focus();
          } else {
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('start-btn').innerText = "Scan Next Participant";
          }
          
          btn.disabled = false;
          btn.innerText = "Grant Access (Mark Present)";
        })
        .withFailureHandler(function(error) {
          alert("Error marking attendance: " + error.message);
          btn.disabled = false;
          btn.innerText = "Grant Access (Mark Present)";
        })
        .markPresent(currentRow);
    }
  </script>
</body>
</html>
