<script>
  let html5QrCode;
  let currentRow = null;
  
  // ⚠️ IMPORTANT: Paste your actual Google Apps Script Web App URL here!
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_URL_ID_HERE/exec";

  function startScanner() {
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('reader').style.display = 'block';
    document.getElementById('status-msg').innerText = "Initializing rear camera...";

    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode.start(
      { facingMode: "environment" }, 
      config,
      onScanSuccess,
      onScanFailure
    ).catch((err) => {
      document.getElementById('status-msg').innerText = "Error accessing camera. Please ensure permissions are granted.";
      document.getElementById('start-btn').style.display = 'inline-block';
    });
  }

  function onScanSuccess(decodedText, decodedResult) {
    html5QrCode.stop().then(() => {
      document.getElementById('reader').style.display = 'none';
      document.getElementById('status-msg').innerText = "Sigil scanned! Consulting the Maesters...";
      verifyTicket(decodedText);
    }).catch((err) => console.error("Failed to stop scanner", err));
  }

  function onScanFailure(error) { /* Ignore background scanning errors */ }

  // --- REPLACED WITH FETCH API ---
  function verifyTicket(ticketNumber) {
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // Using text/plain prevents CORS blocking
      body: JSON.stringify({ action: "getDetails", ticketNumber: ticketNumber })
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'success') {
        document.getElementById('status-msg').innerText = "";
        document.getElementById('result-card').style.display = 'block';
        
        document.getElementById('res-name').innerText = data.name;
        document.getElementById('res-college').innerText = data.college;
        document.getElementById('res-events').innerText = data.events;
        document.getElementById('res-ticket').innerText = data.ticket;
        
        currentRow = data.row;
      } else {
        document.getElementById('status-msg').innerText = data.message;
        document.getElementById('start-btn').style.display = 'inline-block';
        document.getElementById('start-btn').innerText = "Scan Another Sigil";
      }
    })
    .catch(error => {
      document.getElementById('status-msg').innerText = "Network Error: " + error.message;
    });
  }

  // --- REPLACED WITH FETCH API ---
  function markAttendance() {
    if (!currentRow) return;
    
    const btn = document.getElementById('mark-btn');
    btn.disabled = true;
    btn.innerText = "Forging Records...";
    
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "markPresent", rowNumber: currentRow })
    })
    .then(response => response.json())
    .then(data => {
      alert(data.message);
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('start-btn').style.display = 'inline-block';
      document.getElementById('start-btn').innerText = "Scan Next Participant";
      btn.disabled = false;
      btn.innerText = "Grant Access (Mark Present)";
    })
    .catch(error => {
      alert("Error marking attendance: " + error.message);
      btn.disabled = false;
      btn.innerText = "Grant Access (Mark Present)";
    });
  }
</script>
