<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cebroid 2k26 - Kingsguard Scanner</title>
  
  <!-- Load the open-source HTML5-QRCode library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    body { font-family: 'Georgia', serif; background-color: #050505; color: #eaeaea; text-align: center; margin: 0; padding: 20px; }
    h2 { color: #e65c00; text-transform: uppercase; letter-spacing: 1px; }
    
    #reader { width: 100%; max-width: 400px; margin: 20px auto; display: none; border: 2px solid #e65c00; border-radius: 10px; background: #111; overflow: hidden; }
    
    .btn { background-color: #e65c00; color: #fff; padding: 15px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; font-family: Arial, sans-serif; box-shadow: 0 4px 6px rgba(230, 92, 0, 0.3); }
    .btn:disabled { background-color: #555; cursor: not-allowed; box-shadow: none; }
    .btn-success { background-color: #28a745; box-shadow: 0 4px 6px rgba(40, 167, 69, 0.3); }
    
    #result-card { display: none; background: #1e1e1e; padding: 25px; border-radius: 10px; margin: 20px auto; max-width: 400px; border: 1px solid #333; text-align: left; font-family: Arial, sans-serif; }
    .detail { margin: 12px 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .detail span { color: #e65c00; font-weight: bold; float: right; }
    
    #status-msg { margin-top: 15px; color: #888; font-family: Arial, sans-serif; }
  </style>
</head>
<body>

  <h2>Kingsguard Scanner</h2>
  <p style="font-family: Arial, sans-serif; font-size: 14px; color: #aaa;">Verify tributes entering the symposium</p>

  <button id="start-btn" class="btn" onclick="startScanner()">Open Rear Camera</button>
  
  <div id="reader"></div>
  <div id="status-msg"></div>

  <!-- Participant Details Card -->
  <div id="result-card">
    <h3 style="color:#e65c00; text-align:center; margin-top:0; border-bottom: 2px solid #e65c00; padding-bottom:10px;">Tribute Identified</h3>
    <div class="detail"><strong>Name:</strong> <span id="res-name"></span></div>
    <div class="detail"><strong>College:</strong> <span id="res-college"></span></div>
    <div class="detail"><strong>Events:</strong> <span id="res-events"></span></div>
    <div class="detail"><strong>Ticket:</strong> <span id="res-ticket"></span></div>
    
    <div style="text-align: center;">
      <button id="mark-btn" class="btn btn-success" onclick="markAttendance()">Grant Access (Mark Present)</button>
    </div>
  </div>

  <script>
    let html5QrCode;
    let currentRow = null;
    
    // ⚠️ IMPORTANT: Paste your actual Google Apps Script Web App URL below
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhjuzzvMnufPqGcTPGRPfBZoPhKPmFg6XWbt5wcwvqw6nn9RuYypircLfvSU8-xhGA/exec";

    function startScanner() {
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('reader').style.display = 'block';
      document.getElementById('status-msg').innerText = "Initializing rear camera...";

      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config,
        onScanSuccess,
        onScanFailure
      ).catch((err) => {
        document.getElementById('status-msg').innerText = "Error accessing camera. Please ensure permissions are granted.";
        document.getElementById('start-btn').style.display = 'inline-block';
      });
    }

    function onScanSuccess(decodedText, decodedResult) {
      html5QrCode.stop().then(() => {
        document.getElementById('reader').style.display = 'none';
        document.getElementById('status-msg').innerText = "Sigil scanned! Consulting the Maesters...";
        verifyTicket(decodedText);
      }).catch((err) => console.error("Failed to stop scanner", err));
    }

    function onScanFailure(error) {
      // Background scanning errors are ignored
    }

    function verifyTicket(ticketNumber) {
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "getDetails", ticketNumber: ticketNumber })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          document.getElementById('status-msg').innerText = "";
          document.getElementById('result-card').style.display = 'block';
          
          document.getElementById('res-name').innerText = data.name;
          document.getElementById('res-college').innerText = data.college;
          document.getElementById('res-events').innerText = data.events;
          document.getElementById('res-ticket').innerText = data.ticket;
          
          currentRow = data.row;
        } else {
          document.getElementById('status-msg').innerText = data.message;
          document.getElementById('start-btn').style.display = 'inline-block';
          document.getElementById('start-btn').innerText = "Scan Another Sigil";
        }
      })
      .catch(error => {
        document.getElementById('status-msg').innerText = "Network Error: " + error.message;
      });
    }

    function markAttendance() {
      if (!currentRow) return;
      
      const btn = document.getElementById('mark-btn');
      btn.disabled = true;
      btn.innerText = "Forging Records...";
      
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "markPresent", rowNumber: currentRow })
      })
      .then(response => response.json())
      .then(data => {
        alert(data.message);
        document.getElementById('result-card').style.display = 'none';
        document.getElementById('start-btn').style.display = 'inline-block';
        document.getElementById('start-btn').innerText = "Scan Next Participant";
        btn.disabled = false;
        btn.innerText = "Grant Access (Mark Present)";
      })
      .catch(error => {
        alert("Error marking attendance: " + error.message);
        btn.disabled = false;
        btn.innerText = "Grant Access (Mark Present)";
      });
    }
  </script>
</body>
</html>
