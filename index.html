<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <base target="_top">
  <title>Kingsguard Scanner - Cebroid 2k26</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:       #e65c00;
      --orange-light: #ff7a1a;
      --orange-glow:  rgba(230, 92, 0, 0.25);
      --green:        #22c55e;
      --green-glow:   rgba(34, 197, 94, 0.25);
      --red:          #ef4444;
      --bg:           #050505;
      --surface:      #0f0f0f;
      --surface-2:    #161616;
      --surface-3:    #1e1e1e;
      --border:       #252525;
      --border-hi:    #333;
      --text:         #f0f0f0;
      --muted:        #888;
      --dim:          #555;
      --radius:       16px;
      --radius-sm:    10px;
      --safe-top:     env(safe-area-inset-top, 0px);
      --safe-bottom:  env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; overscroll-behavior: none; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 88px);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(5,5,5,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px 12px;
      text-align: center;
    }
    .app-header h1 {
      font-size: 17px;
      font-weight: 800;
      color: var(--orange);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .app-header p { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 0.5px; }

    /* Content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 16px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    /* Tabs */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 4px;
      border: 1px solid var(--border);
    }
    .mode-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 12px 8px;
      border: none;
      background: transparent;
      border-radius: 7px;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-tab.active { background: var(--surface-3); color: var(--orange); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .mode-tab svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* Panels */
    #scanner-panel { display: block; }
    #manual-panel  { display: none; }

    /* Camera Button */
    #start-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #e65c00, #c94e00);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--orange-glow);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.3px;
    }
    #start-btn:active { transform: scale(0.97); box-shadow: 0 2px 10px var(--orange-glow); }
    #start-btn:disabled { background: #2a2a2a; color: var(--muted); box-shadow: none; cursor: not-allowed; }

    /* Reader */
    #reader {
      display: none;
      width: 100%;
      border: 2px solid var(--orange);
      border-radius: var(--radius);
      overflow: hidden;
      background: #111;
      box-shadow: 0 0 30px var(--orange-glow);
    }

    /* Manual Input */
    .input-group { display: flex; flex-direction: column; gap: 10px; }
    /* Prefix input: Cebroid-[number] */
    .input-prefix-row {
      display: flex;
      align-items: stretch;
      background: var(--surface-2);
      border: 1.5px solid var(--border-hi);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-prefix-row:focus-within {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-glow);
    }
    .input-prefix-row.error {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(239,68,68,0.2);
      animation: shake 0.4s ease;
    }
    .ticket-prefix {
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: rgba(230,92,0,0.12);
      border-right: 1.5px solid rgba(230,92,0,0.3);
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: 1px;
      white-space: nowrap;
      user-select: none;
      flex-shrink: 0;
    }
    #manual-ticket-input {
      flex: 1;
      padding: 17px 16px;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      outline: none;
      min-width: 0;
      -webkit-appearance: none;
    }
    #manual-ticket-input::placeholder { color: var(--dim); font-family: 'Inter', sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 0.5px; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    #manual-verify-btn {
      width: 100%;
      padding: 17px;
      background: linear-gradient(135deg, #e65c00, #c94e00);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px var(--orange-glow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #manual-verify-btn:active:not(:disabled) { transform: scale(0.97); box-shadow: 0 2px 8px var(--orange-glow); }
    #manual-verify-btn:disabled { background: #2a2a2a; color: var(--muted); box-shadow: none; cursor: not-allowed; }

    /* Status */
    #status-msg {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border-hi);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result Card */
    #result-card {
      display: none;
      background: var(--surface-2);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    .result-header {
      background: linear-gradient(135deg, rgba(230,92,0,0.14), rgba(201,78,0,0.07));
      border-bottom: 1px solid rgba(230,92,0,0.28);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .check-icon {
      width: 38px; height: 38px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 16px var(--green-glow);
    }
    .check-icon svg { width: 20px; height: 20px; color: #fff; }
    .result-header-text h3 { font-size: 15px; font-weight: 700; }
    .result-header-text p { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .result-body { padding: 4px 0; }
    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; width: 60px; }
    .detail-value { font-size: 14px; font-weight: 600; text-align: right; word-break: break-word; }
    .ticket-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--orange);
      background: rgba(230,92,0,0.1);
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid rgba(230,92,0,0.2);
    }

    /* Fixed Bottom Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10,10,10,0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      padding: 14px 16px calc(14px + var(--safe-bottom));
      display: none;
    }
    .bottom-bar.visible { display: block; }

    #mark-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 24px var(--green-glow);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.3px;
    }
    #mark-btn:active:not(:disabled) { transform: scale(0.97); box-shadow: 0 2px 10px var(--green-glow); }
    #mark-btn:disabled { background: #2a2a2a; color: var(--muted); box-shadow: none; cursor: not-allowed; }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Kingsguard Scanner</h1>
    <p>Cebroid 2k26 &middot; Reception Desk</p>
  </header>

  <main class="content">

    <!-- Mode Tabs -->
    <div class="mode-tabs" role="tablist">
      <button class="mode-tab active" id="tab-qr" role="tab" onclick="switchMode('qr')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1" fill="none"/><rect x="14" y="3" width="7" height="7" rx="1" fill="none"/>
          <rect x="3" y="14" width="7" height="7" rx="1" fill="none"/><rect x="14" y="14" width="3" height="3" rx="0.5"/>
          <rect x="19" y="14" width="2" height="2" rx="0.5"/><rect x="14" y="19" width="2" height="2" rx="0.5"/>
          <rect x="18" y="18" width="3" height="3" rx="0.5"/>
          <path stroke-linecap="round" d="M5 5h3v3H5zM16 5h3v3h-3zM5 16h3v3H5z"/>
        </svg>
        Scan QR
      </button>
      <button class="mode-tab" id="tab-manual" role="tab" onclick="switchMode('manual')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/>
        </svg>
        Manual Entry
      </button>
    </div>

    <!-- QR Panel -->
    <div id="scanner-panel">
      <button id="start-btn" onclick="startScanner()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="22" height="22">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/>
        </svg>
        Open Camera &amp; Scan QR
      </button>
      <div id="reader"></div>
    </div>

    <!-- Manual Panel -->
    <div id="manual-panel">
      <div class="input-group">
        <!-- Prefix badge + number input -->
        <div class="input-prefix-row" id="prefix-row" onclick="document.getElementById('manual-ticket-input').focus()">
          <span class="ticket-prefix">Cebroid-</span>
          <input
            id="manual-ticket-input"
            type="text"
            inputmode="numeric"
            placeholder="e.g. 004"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            maxlength="6"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')"
            onkeydown="if(event.key==='Enter') manualVerify()"
          />
        </div>
        <button id="manual-verify-btn" onclick="manualVerify()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803 7.5 7.5 0 0015.803 15.803z"/>
          </svg>
          Verify Ticket
        </button>
      </div>
    </div>

    <!-- Status -->
    <div id="status-msg"></div>

    <!-- Result Card -->
    <div id="result-card">
      <div class="result-header">
        <div class="check-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
          </svg>
        </div>
        <div class="result-header-text">
          <h3>Tribute Identified</h3>
          <p>Participant found in registry</p>
        </div>
      </div>
      <div class="result-body">
        <div class="detail-row">
          <span class="detail-label">Name</span>
          <span class="detail-value" id="res-name"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">College</span>
          <span class="detail-value" id="res-college"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Events</span>
          <span class="detail-value" id="res-events"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Ticket</span>
          <span class="detail-value ticket-val" id="res-ticket"></span>
        </div>
      </div>
    </div>

  </main>

  <!-- Fixed Bottom Action Bar -->
  <div class="bottom-bar" id="bottom-bar">
    <button id="mark-btn" onclick="markAttendance()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" width="20" height="20">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Grant Access &mdash; Mark Present
    </button>
  </div>

  <script>
    // ── CONFIG — paste your Apps Script /exec URL here ──────────
    const API_URL = 'https://script.google.com/macros/s/AKfycbxGCI0K38bw00XmbxQMhUPvj2M7PaDDjC8yhXN9526ghP_CKlrj-1xMciWXiOJ-X02RtA/exec';
    // ─────────────────────────────────────────────────────────────

    let html5QrCode;
    let currentRow  = null;
    let currentMode = 'qr';

    /* Mode tabs */
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-qr').classList.toggle('active',     mode === 'qr');
      document.getElementById('tab-manual').classList.toggle('active', mode === 'manual');
      document.getElementById('scanner-panel').style.display = mode === 'qr'     ? 'block' : 'none';
      document.getElementById('manual-panel').style.display  = mode === 'manual' ? 'block' : 'none';

      if (mode === 'manual') {
        if (html5QrCode) {
          html5QrCode.stop().catch(() => {});
          document.getElementById('reader').style.display = 'none';
          resetStartBtn();
        }
        setTimeout(() => document.getElementById('manual-ticket-input').focus(), 120);
      }

      setStatus('');
      hideResultCard();
    }

    /* QR Scanner */
    function startScanner() {
      const btn = document.getElementById('start-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Initializing camera\u2026';
      hideResultCard();
      document.getElementById('reader').style.display = 'block';
      setStatus('<span class="spinner"></span> Accessing rear camera\u2026');

      html5QrCode = new Html5Qrcode('reader');
      html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 12, qrbox: { width: 240, height: 240 } },
        onScanSuccess,
        () => {}
      ).then(() => {
        btn.innerHTML = '\u23F9 Stop Scanner';
        btn.onclick = stopScanner;
        btn.disabled = false;
        setStatus('');
      }).catch(() => {
        setStatus('\u26A0 Camera access denied. Check permissions.');
        document.getElementById('reader').style.display = 'none';
        resetStartBtn();
      });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {}).finally(() => {
          document.getElementById('reader').style.display = 'none';
          resetStartBtn();
          setStatus('');
        });
      }
    }

    function resetStartBtn() {
      const btn = document.getElementById('start-btn');
      btn.disabled = false;
      btn.onclick = startScanner;
      btn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="22" height="22">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/>
        </svg>
        Open Camera &amp; Scan QR`;
    }

    function onScanSuccess(decodedText) {
      html5QrCode.stop().then(() => {
        document.getElementById('reader').style.display = 'none';
        resetStartBtn();
        setStatus('<span class="spinner"></span> Sigil scanned! Consulting the Maesters\u2026');
        verifyTicket(decodedText, null);
      }).catch(console.error);
    }

    /* Manual verify — staff types only the number, Cebroid- is auto-prepended */
    function manualVerify() {
      const input      = document.getElementById('manual-ticket-input');
      const prefixRow  = document.getElementById('prefix-row');
      const rawNumber  = input.value.trim();

      if (!rawNumber) {
        prefixRow.classList.add('error');
        input.focus();
        setTimeout(() => prefixRow.classList.remove('error'), 700);
        return;
      }

      // Auto-prepend prefix — staff only types the number
      const ticket = 'Cebroid-' + rawNumber;

      const btn = document.getElementById('manual-verify-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Looking up\u2026';
      hideResultCard();
      setStatus('');
      verifyTicket(ticket, () => {
        btn.disabled = false;
        btn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803 7.5 7.5 0 0015.803 15.803z"/>
          </svg>
          Verify Ticket`;
      });
    }

    /* Shared verify — calls Apps Script REST API */
    function verifyTicket(ticketNumber, onDone) {
      const url = API_URL + '?action=verify&ticket=' + encodeURIComponent(ticketNumber);

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(response) {
          if (onDone) onDone();
          setStatus('');
          if (response.status === 'success') {
            document.getElementById('res-name').innerText    = response.name;
            document.getElementById('res-college').innerText = response.college;
            document.getElementById('res-events').innerText  = response.events;
            document.getElementById('res-ticket').innerText  = response.ticket;
            currentRow = response.row;
            showResultCard();
            if (currentMode === 'manual') document.getElementById('manual-ticket-input').value = '';
          } else {
            setStatus('\u274C ' + response.message);
          }
        })
        .catch(function(err) {
          if (onDone) onDone();
          setStatus('\u26A0 Network error: ' + err.message);
        });
    }

    /* Mark Attendance — calls Apps Script REST API */
    function markAttendance() {
      if (!currentRow) return;
      const btn = document.getElementById('mark-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Forging Records\u2026';

      const url = API_URL + '?action=markPresent&row=' + currentRow;

      const resetBtn = () => {
        btn.disabled = false;
        btn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" width="20" height="20">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Grant Access &mdash; Mark Present`;
      };

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(response) {
          resetBtn();
          if (response.status === 'success') {
            hideResultCard();
            currentRow = null;
            setStatus('\u2705 ' + response.message);
            setTimeout(() => setStatus(''), 3500);
            if (currentMode === 'manual') document.getElementById('manual-ticket-input').focus();
          } else {
            setStatus('\u26A0 ' + response.message);
          }
        })
        .catch(function(err) {
          resetBtn();
          setStatus('\u26A0 Network error: ' + err.message);
        });
    }

    /* Helpers */
    function setStatus(html) { document.getElementById('status-msg').innerHTML = html; }

    function showResultCard() {
      document.getElementById('result-card').style.display = 'block';
      document.getElementById('bottom-bar').classList.add('visible');
      setTimeout(() => document.getElementById('result-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
    }

    function hideResultCard() {
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('bottom-bar').classList.remove('visible');
    }
  </script>
</body>
</html>
